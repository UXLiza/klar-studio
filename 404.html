<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Klar Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700;1,800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  
</head>
<body class="bg-white text-ink antialiased min-h-screen flex flex-col">

  <!-- СЮДА JS ВСТАВИТ ШАПКУ -->
  <div id="header-placeholder"></div>

  <!-- ===== 404 CONTENT ===== -->
  <main class="flex-grow flex items-center justify-center section-pad py-20">
    <div class="max-w-[1440px] w-full mx-auto">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
        
        <!-- Текст -->
        <div class="order-2 lg:order-1">
          <p class="mb-4 text-sm text-muted uppercase tracking-wider">Error 404</p>
          <h1 class="text-[8rem] lg:text-[12rem] font-bold leading-none tracking-tight">
            404
          </h1>
          <h2 class="mt-4 text-3xl lg:text-5xl font-bold uppercase tracking-tight">
            Page not found
          </h2>
          <p class="mt-6 text-lg text-muted max-w-md">
            The page you're looking for doesn't exist or has been moved. Let's get you back on track.
          </p>
          <div class="mt-10 flex flex-col sm:flex-row gap-4">
            <a href=" index.html" class="inline-flex items-center justify-center gap-2 bg-ink text-white px-8 py-4 text-lg font-bold hover:bg-neutral-800 transition-colors">
              go back home
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </a>
            <a href="projects.html" class="inline-flex items-center justify-center gap-2 border border-gray-300 px-8 py-4 text-lg font-bold hover:border-ink transition-colors">
              view projects
            </a>
          </div>
        </div>

        <!-- Изображение -->
        <div class="order-1 lg:order-2">
          <div class="w-full aspect-square overflow-hidden border border-gray-200">
            <img src="img/Common/hero.webp" class="w-full h-full object-cover" alt="Interior">
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- СЮДА JS ВСТАВИТ ПОДВАЛ -->
  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
</body>
</html>
