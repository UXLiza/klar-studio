<!-- Баннер Cookies -->
<div id="cookie-banner" class="fixed bottom-0 left-0 right-0 z-50 p-4 sm:p-6 lg:p-8">
  <div class="mx-auto max-w-[1440px] bg-white border border-gray-200 shadow-lg p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div class="flex-1">
      <h3 class="text-lg font-bold text-ink mb-2">We use cookies</h3>
      <p class="text-sm text-muted leading-relaxed">
        We use cookies to improve your experience on our website. By browsing this website, you agree to our use of cookies.
        <a href="#privacy" class="underline hover:text-ink transition-colors">Learn more</a>
      </p>
    </div>
    <div class="flex gap-3 shrink-0">
      <button id="cookie-reject" class="px-6 py-2 text-sm font-medium text-ink border border-gray-300 hover:border-ink transition-colors">
        Reject
      </button>
      <button id="cookie-accept" class="px-6 py-2 text-sm font-medium text-white bg-[#1C1D21] hover:bg-black transition-colors">
        Accept
      </button>
    </div>
  </div>
</div>
